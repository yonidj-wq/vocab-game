<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>משחק אנגלית</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;direction:rtl}
#app{max-width:680px;margin:0 auto;padding:10px 8px 30px}
header{text-align:center;padding:14px 8px 6px;color:#fff}
header h1{font-size:1.75rem;text-shadow:0 2px 6px rgba(0,0,0,.3);margin-bottom:8px}
#scorebar{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
#scorebar span{background:rgba(255,255,255,.22);padding:4px 16px;border-radius:20px;font-size:.9rem}
nav{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
nav button{background:rgba(255,255,255,.22);color:#fff;border:2px solid rgba(255,255,255,.35);border-radius:22px;padding:7px 13px;font-size:.82rem;cursor:pointer;transition:.18s;font-family:inherit}
nav button.active,nav button:hover{background:#fff;color:#764ba2;font-weight:700;border-color:#fff}
#gc{background:#fff;border-radius:20px;padding:20px 18px;min-height:320px;box-shadow:0 8px 32px rgba(0,0,0,.18)}
/* ── section header ── */
.sec-title{text-align:center;font-size:1rem;color:#7c3aed;font-weight:700;margin-bottom:12px;letter-spacing:.3px}
.prog{font-size:.82rem;color:#aaa;margin-bottom:10px;text-align:center}
/* ── flashcard ── */
.flip-scene{perspective:800px;width:100%;max-width:420px;margin:0 auto 14px;height:180px;cursor:pointer}
.flip-card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:.55s}
.flip-card.flipped{transform:rotateY(180deg)}
.flip-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px}
.flip-front{background:linear-gradient(135deg,#e0e7ff,#f0f4ff);border:2px solid #c7d2fe}
.flip-back{background:linear-gradient(135deg,#f3e8ff,#ede9fe);border:2px solid #c4b5fd;transform:rotateY(180deg)}
.flip-en{font-size:2rem;font-weight:800;color:#3730a3}
.flip-he{font-size:1.8rem;font-weight:700;color:#6d28d9}
.flip-hint{font-size:.8rem;color:#999;margin-top:8px}
/* ── buttons ── */
.btn{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:13px;padding:12px 22px;font-size:1rem;cursor:pointer;margin:5px;transition:.18s;min-width:110px;font-family:inherit;font-weight:600}
.btn:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(102,126,234,.45)}
.btn-sm{padding:8px 14px;font-size:.88rem;min-width:auto}
.btn-green{background:linear-gradient(135deg,#10b981,#059669)}
.btn-blue{background:linear-gradient(135deg,#06b6d4,#0284c7)}
.btn-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap;gap:8px}
/* ── options ── */
.options{display:flex;flex-direction:column;gap:9px;margin:12px 0}
.opt{background:#f8f7ff;border:2px solid #c7d2fe;border-radius:12px;padding:13px 16px;cursor:pointer;font-size:1rem;text-align:right;transition:.18s;font-family:inherit;line-height:1.4}
.opt:hover:not(.disabled){background:#ede9fe;border-color:#818cf8}
.opt.correct{background:#d1fae5!important;border-color:#10b981!important;color:#065f46}
.opt.wrong{background:#fee2e2!important;border-color:#ef4444!important;color:#991b1b}
.opt.disabled{pointer-events:none;opacity:.85}
/* ── feedback ── */
.fb{text-align:center;font-size:1.35rem;font-weight:700;padding:12px;border-radius:12px;margin:10px 0;display:none}
.fb.show{display:block}
.fb.ok{background:#d1fae5;color:#065f46}
.fb.no{background:#fee2e2;color:#991b1b}
/* ── question ── */
.q-en{font-size:1.18rem;font-weight:700;color:#1e1b4b;margin:6px 0 14px;line-height:1.55;text-align:center}
.q-he{font-size:1.22rem;font-weight:700;color:#7c3aed;margin:6px 0 14px;line-height:1.5;text-align:center}
.blank{display:inline-block;border-bottom:3px solid #7c3aed;min-width:76px;margin:0 3px;color:#7c3aed;font-weight:700}
/* ── matching ── */
.match-cols{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.match-col{display:flex;flex-direction:column;gap:8px}
.mi{background:#f8f7ff;border:2px solid #c7d2fe;border-radius:12px;padding:11px 9px;cursor:pointer;text-align:center;font-size:.95rem;transition:.18s;line-height:1.3}
.mi:hover:not(.matched){background:#ede9fe;border-color:#818cf8}
.mi.sel{background:#ddd6fe;border-color:#7c3aed;font-weight:700}
.mi.matched{background:#d1fae5;border-color:#10b981;pointer-events:none;color:#065f46}
.mi.bad{background:#fee2e2;border-color:#ef4444}
/* ── done screen ── */
.done-screen{text-align:center;padding:28px 10px}
.done-screen .trophy{font-size:3rem;margin-bottom:10px}
.done-screen p{font-size:1.2rem;color:#7c3aed;font-weight:700;margin-bottom:16px}
/* ── confetti ── */
#confetti-wrap{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999}
.cp{position:absolute;width:9px;height:9px;border-radius:2px;animation:cffall linear forwards}
@keyframes cffall{to{transform:translateY(105vh) rotate(720deg);opacity:0}}
@media(max-width:460px){.flip-en{font-size:1.5rem}.flip-he{font-size:1.4rem}.opt{font-size:.93rem}}
</style>
</head>

function shuffle(a){return [...a].sort(()=>Math.random()-.5)}

function speak(text){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate=0.88;
  speechSynthesis.speak(u);
}

function gc(){return document.getElementById('gc')}

function addScore(n){
  G.score+=n; G.streak++;
  document.getElementById('s-score').textContent=G.score;
  document.getElementById('s-streak').textContent=G.streak;
  if(G.streak>=3) confetti();
}
function resetStreak(){
  G.streak=0;
  document.getElementById('s-streak').textContent=0;

    const p=document.createElement('div');
    p.className='cp';
    p.style.cssText=`left:${Math.random()*100}%;top:-12px;background:${cols[i%cols.length]};transform:rotate(${Math.random()*360}deg);animation-duration:${1.2+Math.random()*1.4}s;animation-delay:${Math.random()*.6}s`;
    w.appendChild(p);
  }
  setTimeout(()=>w.innerHTML='',3500);
}

function doneScreen(onRestart){
  gc().innerHTML='';
  const d=document.createElement('div');
  d.className='done-screen';
  d.innerHTML='<div class="trophy">🏆</div><p>כל הכבוד! סיימת את כל השאלות!</p>';
  const btn=document.createElement('button');
  btn.className='btn btn-green'; btn.textContent='שחק שוב';
  btn.onclick=onRestart;
  d.appendChild(btn);
  gc().appendChild(d);
  confetti();
}

function showFeedback(correct, el, correctEl){
  document.querySelectorAll('.opt').forEach(o=>{o.classList.add('disabled')});
  if(correct){
    el.classList.add('correct');
    addScore(10);
  } else {
    el.classList.add('wrong');
    if(correctEl) correctEl.classList.add('correct');
    resetStreak();
  }
  const fb=document.getElementById('fb');
  fb.textContent=correct?'✅ נכון!':'❌ לא נכון';
  fb.className='fb show '+(correct?'ok':'no');
}

// ═══════════════════════════════════════════════════════════════
//  NAV
// ═══════════════════════════════════════════════════════════════
function setMode(m){
  G.mode=m;
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+m).classList.add('active');
  speechSynthesis && speechSynthesis.cancel();
  const init={flash:initFlash,vocab:initVocab,fillin:initFillIn,build:initBuild,translate:initTranslate,match:initMatch};
  init[m]();
}

// ═══════════════════════════════════════════════════════════════
//  A. FLASHCARDS
// ═══════════════════════════════════════════════════════════════
function initFlash(){
  G.queue=shuffle(VOCAB); G.qi=0; G.flipped=false;
  renderFlash();
}

function renderFlash(){
  const item=G.queue[G.qi];
  const box=gc();
  box.innerHTML='';

  const title=el('div','sec-title','📇 כרטיסיות — לחץ על הכרטיס לראות עברית');
  const prog=el('div','prog',`כרטיס ${G.qi+1} מתוך ${G.queue.length}`);

  const scene=document.createElement('div'); scene.className='flip-scene';
  const card=document.createElement('div');  card.className='flip-card'+(G.flipped?' flipped':'');
  card.onclick=()=>{G.flipped=!G.flipped; card.classList.toggle('flipped'); hint.textContent=G.flipped?'לחץ לחזור':'לחץ לתרגום';};

  const front=document.createElement('div'); front.className='flip-face flip-front';
  const enSpan=el('div','flip-en',item.en);
  const hint=el('div','flip-hint',G.flipped?'לחץ לחזור':'לחץ לתרגום');
  front.append(enSpan,hint);

  const back=document.createElement('div');  back.className='flip-face flip-back';
  back.appendChild(el('div','flip-he',item.he));

  card.append(front,back);
  scene.appendChild(card);

  const soundBtn=button('🔊 שמע','btn btn-blue btn-sm',()=>speak(item.en));

  const navRow=document.createElement('div'); navRow.className='btn-row';
  const prev=button('◀ קודם','btn btn-green btn-sm',()=>{G.qi=(G.qi-1+G.queue.length)%G.queue.length; G.flipped=false; renderFlash();});
  const next=button('הבא ▶','btn btn-green btn-sm',()=>{G.qi=(G.qi+1)%G.queue.length; if(G.qi===0)G.queue=shuffle(VOCAB); G.flipped=false; renderFlash();});
  navRow.append(prev,next);

  box.append(title,prog,scene,soundBtn,navRow);
}

// ═══════════════════════════════════════════════════════════════
//  B. VOCABULARY MULTIPLE CHOICE
// ═══════════════════════════════════════════════════════════════
function initVocab(){
  G.queue=shuffle(VOCAB); G.qi=0;
  renderVocab();
}

function renderVocab(){
  if(G.qi>=G.queue.length){doneScreen(initVocab);return;}
  const item=G.queue[G.qi];
  const wrong=shuffle(VOCAB.filter(v=>v.en!==item.en)).slice(0,3);
  const opts=shuffle([item,...wrong]);

  const box=gc(); box.innerHTML='';
  box.append(
    el('div','sec-title','🔤 מה המשמעות?'),
    el('div','prog',`שאלה ${G.qi+1} מתוך ${G.queue.length}`)
  );

  const qRow=document.createElement('div'); qRow.style.cssText='text-align:center;margin:8px 0';
  const wordSpan=el('span','flip-en',item.en); wordSpan.style.fontSize='1.8rem';
  const sndBtn=button('🔊','btn btn-blue btn-sm',()=>speak(item.en));
  qRow.append(wordSpan,' ',sndBtn);
  box.appendChild(qRow);

  const optDiv=document.createElement('div'); optDiv.className='options';
  const fb=el('div','fb','');
  fb.id='fb';

  opts.forEach(o=>{
    const b=document.createElement('div'); b.className='opt'; b.textContent=o.he;
    b.onclick=()=>{
      const correctEl=optDiv.querySelector('[data-correct="1"]');
      showFeedback(o.en===item.en, b, correctEl);
      setTimeout(()=>{G.qi++; renderVocab();}, o.en===item.en?1200:1700);
    };
    if(o.en===item.en) b.dataset.correct='1';
    optDiv.appendChild(b);
  });

  box.append(optDiv,fb);
}

// ═══════════════════════════════════════════════════════════════
//  C. FILL IN THE BLANK
// ═══════════════════════════════════════════════════════════════
function initFillIn(){
  G.queue=shuffle(FILLIN); G.qi=0;
  renderFillIn();
}

function renderFillIn(){
  if(G.qi>=G.queue.length){doneScreen(initFillIn);return;}
  const q=G.queue[G.qi];
  const opts=shuffle(q.opts);

  const box=gc(); box.innerHTML='';
  box.append(
    el('div','sec-title','✏️ השלם את המשפט'),
    el('div','prog',`שאלה ${G.qi+1} מתוך ${G.queue.length}`)
  );

  // Build question with blank highlighted
  const qDiv=document.createElement('div'); qDiv.className='q-en';
  const parts=q.q.split('___');
  qDiv.appendChild(document.createTextNode(parts[0]));
  const blk=el('span','blank','___');
  qDiv.appendChild(blk);
  if(parts[1]) qDiv.appendChild(document.createTextNode(parts[1]));
  box.appendChild(qDiv);

  const fullSentence=q.q.replace('___',q.ans);
  const sndBtn=button('🔊 שמע משפט','btn btn-blue btn-sm',()=>speak(fullSentence));
  box.appendChild(sndBtn);

  const optDiv=document.createElement('div'); optDiv.className='options';
  const fb=el('div','fb',''); fb.id='fb';

  opts.forEach(o=>{
    const b=document.createElement('div'); b.className='opt'; b.textContent=o;
    b.onclick=()=>{
      const correctEl=optDiv.querySelector('[data-correct="1"]');
      showFeedback(o===q.ans, b, correctEl);
      if(o===q.ans) speak(fullSentence);
      setTimeout(()=>{G.qi++; renderFillIn();}, o===q.ans?1300:1800);
    };
    if(o===q.ans) b.dataset.correct='1';
    optDiv.appendChild(b);
  });

  box.append(optDiv,fb);
}

// ═══════════════════════════════════════════════════════════════
//  D. BUILD A SENTENCE
// ═══════════════════════════════════════════════════════════════
function initBuild(){
  G.queue=shuffle(SENTENCE_BUILD); G.qi=0;
  renderBuild();
}

function renderBuild(){
  if(G.qi>=G.queue.length){doneScreen(initBuild);return;}
  const q=G.queue[G.qi];
  const opts=shuffle(q.opts);

  const box=gc(); box.innerHTML='';
  box.append(
    el('div','sec-title','🔨 בחר את המשפט האנגלי הנכון'),
    el('div','prog',`שאלה ${G.qi+1} מתוך ${G.queue.length}`),
    el('div','q-he','🇮🇱 '+q.he)
  );

  const optDiv=document.createElement('div'); optDiv.className='options';
  const fb=el('div','fb',''); fb.id='fb';

  opts.forEach(o=>{
    const b=document.createElement('div'); b.className='opt'; b.textContent=o;
    b.onclick=()=>{
      const correctEl=optDiv.querySelector('[data-correct="1"]');
      showFeedback(o===q.ans, b, correctEl);
      speak(q.ans);
      setTimeout(()=>{G.qi++; renderBuild();}, o===q.ans?1400:1900);
    };
    if(o===q.ans) b.dataset.correct='1';
    optDiv.appendChild(b);
  });

  box.append(optDiv,fb);
}

// ═══════════════════════════════════════════════════════════════
//  E. TRANSLATE TO HEBREW
// ═══════════════════════════════════════════════════════════════
function initTranslate(){
  G.queue=shuffle(TRANSLATE); G.qi=0;
  renderTranslate();
}

function renderTranslate(){
  if(G.qi>=G.queue.length){doneScreen(initTranslate);return;}
  const q=G.queue[G.qi];
  const opts=shuffle(q.opts);

  const box=gc(); box.innerHTML='';
  box.append(
    el('div','sec-title','🌍 תרגם לעברית'),
    el('div','prog',`שאלה ${G.qi+1} מתוך ${G.queue.length}`)
  );

  const qRow=document.createElement('div'); qRow.style.cssText='text-align:center;margin:8px 0 14px';
  qRow.appendChild(el('div','q-en',q.en));
  const sndBtn=button('🔊 שמע','btn btn-blue btn-sm',()=>speak(q.en));
  qRow.appendChild(sndBtn);
  box.appendChild(qRow);

  const optDiv=document.createElement('div'); optDiv.className='options';
  const fb=el('div','fb',''); fb.id='fb';

  opts.forEach(o=>{
    const b=document.createElement('div'); b.className='opt'; b.textContent=o;
    b.onclick=()=>{
      const correctEl=optDiv.querySelector('[data-correct="1"]');
      showFeedback(o===q.ans, b, correctEl);
      setTimeout(()=>{G.qi++; renderTranslate();}, o===q.ans?1200:1700);
    };
    if(o===q.ans) b.dataset.correct='1';
    optDiv.appendChild(b);
  });

  box.append(optDiv,fb);
}

// ═══════════════════════════════════════════════════════════════
//  F. MATCHING
// ═══════════════════════════════════════════════════════════════
function initMatch(){
  const pairs=shuffle(MATCHING_POOL).slice(0,8);
  G.matchPairs=pairs.map(p=>({en:p.en,he:p.he,matched:false}));
  G.leftOrder=shuffle(G.matchPairs.map((_,i)=>i));
  G.rightOrder=shuffle(G.matchPairs.map((_,i)=>i));
  G.matchSelSide=null; G.matchSelIdx=null; G.matchDone=0;
  renderMatch();
}

function renderMatch(){
  const box=gc(); box.innerHTML='';
  box.append(
    el('div','sec-title','🔗 התאם אנגלית לעברית'),
    el('div','prog',`הותאמו: ${G.matchDone} מתוך ${G.matchPairs.length}`)
  );

  const grid=document.createElement('div'); grid.className='match-cols';
  const colL=document.createElement('div'); colL.className='match-col';
  const colR=document.createElement('div'); colR.className='match-col';

  G.leftOrder.forEach(idx=>{
    const pair=G.matchPairs[idx];
    const item=document.createElement('div');
    item.className='mi'+(pair.matched?' matched':'')+(G.matchSelSide==='left'&&G.matchSelIdx===idx?' sel':'');
    item.textContent=pair.en;
    if(!pair.matched){
      item.onclick=()=>matchClick('left',idx);
    }
    // sound button inside left column item
    if(!pair.matched){
      const sBtn=document.createElement('button');
      sBtn.className='btn btn-blue btn-sm'; sBtn.textContent='🔊';
      sBtn.style.cssText='display:block;margin:4px auto 0;padding:4px 10px;font-size:.75rem;min-width:auto';
      sBtn.onclick=(e)=>{e.stopPropagation(); speak(pair.en);};
      item.appendChild(sBtn);
    }
    colL.appendChild(item);
  });

  G.rightOrder.forEach(idx=>{
    const pair=G.matchPairs[idx];
    const item=document.createElement('div');
    item.className='mi'+(pair.matched?' matched':'')+(G.matchSelSide==='right'&&G.matchSelIdx===idx?' sel':'');
    item.textContent=pair.he;
    if(!pair.matched) item.onclick=()=>matchClick('right',idx);
    colR.appendChild(item);
  });

  grid.append(colL,colR);
  box.appendChild(grid);
}

function matchClick(side,idx){
  if(G.matchSelSide===null){
    G.matchSelSide=side; G.matchSelIdx=idx;
    renderMatch(); return;
  }
  if(G.matchSelSide===side){
    G.matchSelSide=side; G.matchSelIdx=idx;
    renderMatch(); return;
  }
  const leftIdx  = side==='left'  ? idx : G.matchSelIdx;
  const rightIdx = side==='right' ? idx : G.matchSelIdx;

  G.matchSelSide=null; G.matchSelIdx=null;

  if(leftIdx===rightIdx){
    G.matchPairs[leftIdx].matched=true;
    G.matchDone++;
    addScore(15);
    renderMatch();
    if(G.matchDone===G.matchPairs.length){
      setTimeout(()=>doneScreen(initMatch),600);
    }
  } else {
    renderMatch();
    // flash red briefly
    const items=document.querySelectorAll('.mi');
    // find matching DOM items by re-reading their text
    const lPair=G.matchPairs[leftIdx]; const rPair=G.matchPairs[rightIdx];
    items.forEach(it=>{
      if(it.childNodes[0]&&it.childNodes[0].textContent&&(it.childNodes[0].textContent===lPair.en||it.textContent.startsWith(rPair.he))){
        it.classList.add('bad');
        setTimeout(()=>it.classList.remove('bad'),700);
      }
    });
    resetStreak();
  }
}

// ═══════════════════════════════════════════════════════════════
//  DOM HELPERS
// ═══════════════════════════════════════════════════════════════
function el(tag,cls,text){
  const e=document.createElement(tag);
  e.className=cls;
  if(text!==undefined) e.textContent=text;
  return e;
}
function button(text,cls,onclick){
  const b=document.createElement('button');
  b.className=cls; b.textContent=text; b.onclick=onclick;
  return b;
}

// ── START ──
setMode('flash');
</script>
